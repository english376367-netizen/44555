<script>
const DATA={"questions":[{"n":1,"prompt":"Choose the best option to complete blank (1).","opts":{"A":"where","B":"which","C":"who","D":"whose"},"answer":"B","explain":"'Which' thay cho danh từ chỉ vật 'a campaign', làm chủ ngữ của mệnh đề quan hệ.","section":1},{"n":2,"prompt":"Choose the best option to complete blank (2).","opts":{"A":"use","B":"to use","C":"using","D":"used"},"answer":"C","explain":"Sau giới từ 'by' phải dùng V-ing: by using public transport.","section":1},{"n":3,"prompt":"Choose the best option to complete blank (3).","opts":{"A":"positively","B":"positive","C":"posit","D":"positivity"},"answer":"B","explain":"'Positive' là tính từ bổ nghĩa cho danh từ 'impact'.","section":1},{"n":4,"prompt":"Choose the best option to complete blank (4).","opts":{"A":"illustrated clearly maps neighbourhood","B":"neighbourhood clearly illustrated maps","C":"maps neighbourhood illustrated clearly","D":"clearly illustrated neighbourhood maps"},"answer":"D","explain":"Trật tự đúng: trạng từ 'clearly' + phân từ 'illustrated' + danh từ bổ nghĩa 'neighbourhood' + danh từ chính 'maps'.","section":1},{"n":5,"prompt":"Choose the best option to complete blank (5).","opts":{"A":"take","B":"do","C":"make","D":"hold"},"answer":"C","explain":"Cụm từ cố định 'make a pledge' = đưa ra lời cam kết.","section":1},{"n":6,"prompt":"Choose the best option to complete blank (6).","opts":{"A":"within","B":"into","C":"against","D":"onto Read the following leaflet and mark A, B, C or D to indicate the option that best fits each numbered blank from 7 to 12. LEAFLET – TASTE THE STORIES BEHIND OUR FOOD! Our Community Food Festival is returning this Saturday! (7) ______ families have already registered to share traditional recipes, and the number is growing. Volunteers will (8) ______ tasting stations in the school courtyard, where visitors can discover how food connects generations. (9) ______ you have never cooked before, you are welcome to join our beginner-friendly activities. Skilled cooks will give (10) ______ demonstrations so that everyone can follow each step. Participants will also explore the (11) ______ meanings of dishes served during important celebrations. Please listen to other people's stories (12) ______ an open mind; every recipe has a history worth hearing. Admission is free, but please bring a reusable container."},"answer":"B","explain":"Cấu trúc 'turn A into B' = biến A thành B.","section":1},{"n":7,"prompt":"Choose the best option to complete blank (7).","opts":{"A":"Every","B":"Much","C":"A large number of","D":"Little"},"answer":"C","explain":"'A large number of' đi với danh từ đếm được số nhiều 'families' và động từ 'have'.","section":2},{"n":8,"prompt":"Choose the best option to complete blank (8).","opts":{"A":"set up","B":"put off","C":"look after","D":"turn down"},"answer":"A","explain":"'Set up tasting stations' = dựng/bố trí các quầy thử món ăn; các cụm còn lại không phù hợp.","section":2},{"n":9,"prompt":"Choose the best option to complete blank (9).","opts":{"A":"Until","B":"Because","C":"Even if","D":"So that"},"answer":"C","explain":"'Even if' diễn đạt ý nhượng bộ: kể cả khi chưa từng nấu ăn, người tham gia vẫn được chào đón.","section":2},{"n":10,"prompt":"Choose the best option to complete blank (10).","opts":{"A":"interaction","B":"interactively","C":"interact","D":"interactive"},"answer":"D","explain":"Cần tính từ 'interactive' đứng trước danh từ 'demonstrations'.","section":2},{"n":11,"prompt":"Choose the best option to complete blank (11).","opts":{"A":"cultural","B":"culture","C":"cultivate","D":"culturally"},"answer":"A","explain":"'Cultural' là tính từ bổ nghĩa cho 'meanings' (ý nghĩa văn hóa).","section":2},{"n":12,"prompt":"Choose the best option to complete blank (12).","opts":{"A":"between","B":"from","C":"under","D":"with Mark A, B, C or D to indicate the best arrangement of utterances or sentences from 13 to 17."},"answer":"D","explain":"Cụm tự nhiên 'listen ... with an open mind' = lắng nghe với thái độ cởi mở.","section":2},{"n":13,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"c – b – a","B":"b – a – c","C":"a – b – c","D":"b – c – a"},"answer":"B","explain":"b mời tham quan triển lãm; a nhận lời và hỏi giờ; c trả lời giờ hẹn.","arrangementLines":[{"letter":"a","text":"Mai: I'd love to. What time should I come?"},{"letter":"b","text":"Linh: The museum is holding a photo exhibition about local heroes on Saturday. Would you like to join me?"},{"letter":"c","text":"Linh: It opens at nine. Let's meet outside at half past eight."}],"section":3},{"n":14,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – c – a – e – d","B":"a – b – d – c – e","C":"b – a – d – e – c","D":"b – a – c – d – e"},"answer":"D","explain":"b hỏi cảm nhận; a trả lời; c hỏi sản phẩm tự làm; d đáp lại; e kết bằng mong muốn trải nghiệm.","arrangementLines":[{"letter":"a","text":"Son: Yes. A local artisan showed us how to weave a traditional basket."},{"letter":"b","text":"Hoa: Did you enjoy the craft workshop at the village yesterday?"},{"letter":"c","text":"Hoa: That's interesting. Did you get to make one yourself?"},{"letter":"d","text":"Son: I did, although it took me much longer than I expected."},{"letter":"e","text":"Hoa: I'd like to try it next time."}],"section":3},{"n":15,"prompt":"Choose the correct order to complete the email.","opts":{"A":"b – a – d – c – e","B":"e – b – c – a – d","C":"b – c – a – e – d","D":"c – b – e – a – d"},"answer":"C","explain":"b nêu lý do viết email, c giới thiệu kinh nghiệm, a hỏi về dụng cụ, e nối tiếp 'Once I know what to bring', d kết thư.","arrangementLines":[{"letter":"a","text":"Could you please confirm whether volunteers need to bring their own gloves?"},{"letter":"b","text":"I am writing because I saw your notice about the coastal wildlife survey."},{"letter":"c","text":"I have taken part in two school clean-ups and would be happy to help."},{"letter":"d","text":"Thank you for considering my request. I look forward to your reply."},{"letter":"e","text":"Once I know what to bring, could you also tell me where participants should meet?"}],"section":3},{"n":16,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"b – c – d – a – e","B":"c – b – a – e – d","C":"b – d – a – c – e","D":"d – c – b – e – a"},"answer":"A","explain":"b nêu chủ đề; c đưa ví dụ; d dùng 'Such accounts' tham chiếu ví dụ; a nêu hệ quả; e kết luận.","arrangementLines":[{"letter":"a","text":"As a result, young people become more willing to question stereotypes."},{"letter":"b","text":"One effective way to learn about other cultures is to listen to personal stories."},{"letter":"c","text":"For example, an exchange student might describe a celebration that differs from its portrayal in films."},{"letter":"d","text":"Such accounts reveal everyday experiences that are often missing from general descriptions."},{"letter":"e","text":"Over time, this habit of careful listening can strengthen mutual respect."}],"section":3},{"n":17,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"a – b – d – c – e","B":"b – a – c – d – e","C":"b – c – e – a – d","D":"c – a – b – e – d Read the following passage and mark A, B, C or D to indicate the option that best fits each numbered blank from 18 to 22. A COMMUNITY LIBRARY ON WHEELS The idea for a travelling library (18) ______. In 2021, high school student Thao noticed that children in an outlying district had to travel far to borrow books. Rather than waiting for a new building, she began collecting donated books and asked neighbours (19) ______. With the help of a local mechanic, (20) ______. The team then visited small villages every weekend, inviting children to choose books and join storytelling sessions. (21) ______. Encouraged by this response, volunteers added basic science activities and reading games. The project reminds us that meaningful progress does not always require expensive equipment. (22) ______."},"answer":"B","explain":"b giới thiệu tác dụng tiểu sử; a chuyển ý về khó khăn; c minh họa quá trình; d rút ra bài học; e kết luận.","arrangementLines":[{"letter":"a","text":"Yet the breakthroughs described in these stories rarely come without setbacks."},{"letter":"b","text":"Learning about scientists' lives can inspire students to pursue challenging goals."},{"letter":"c","text":"Many researchers spend years testing ideas before achieving a breakthrough."},{"letter":"d","text":"Understanding this process teaches learners that persistence matters as much as talent."},{"letter":"e","text":"For this reason, biographies can offer realistic encouragement rather than effortless success stories."}],"section":3},{"n":18,"prompt":"Choose the best option to complete blank (18).","opts":{"A":"to discover why libraries should be built","B":"whose determination for reading was unusual","C":"which students wanted to encourage reading","D":"began with one student’s determination to widen access to books"},"answer":"D","explain":"Chủ ngữ 'The idea for a travelling library' cần vị ngữ hoàn chỉnh 'began with...'.","section":4},{"n":19,"prompt":"Choose the best option to complete blank (19).","opts":{"A":"to help sort books and organise weekend visits","B":"that help sorting books and weekend visits","C":"helped sorting books during weekend visits","D":"help sort books and organise weekend visits"},"answer":"A","explain":"Cấu trúc 'ask somebody to do something': asked neighbours to help...","section":4},{"n":20,"prompt":"Choose the best option to complete blank (20).","opts":{"A":"many donated books had been returned to their owners","B":"a mobile bookshelf was forgotten beside the road","C":"the students turned an unused cargo bicycle into a mobile bookshelf","D":"the children stopped visiting the reading sessions"},"answer":"C","explain":"Cụm mở đầu 'With the help of a local mechanic' dẫn đến việc học sinh chế tạo kệ sách di động; chủ ngữ phù hợp và logic.","section":4},{"n":21,"prompt":"Choose the best option to complete blank (21).","opts":{"A":"At first, the school decided to end all reading activities","B":"Before long, families began waiting for the library’s arrival each Saturday","C":"As a result, the library had no books to lend","D":"However, nobody in the villages was allowed to borrow anything"},"answer":"B","explain":"Việc các gia đình mong chờ thư viện giải thích cho 'Encouraged by this response' ở câu tiếp theo.","section":4},{"n":22,"prompt":"Choose the best option to complete blank (22).","opts":{"A":"A small idea, supported by a community, can open new opportunities for children","B":"Although community members were unwilling to share their time","C":"Unless reading is replaced entirely by digital entertainment","D":"Because every village already had a fully equipped public library Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 23 to 30. THE QUIET POWER OF URBAN WETLANDS In many growing cities, wetlands are dismissed as muddy, unused land. Yet these areas perform valuable services that are difficult to replace. During heavy rain, their soil and plants can retain water, slowing the flow into nearby streets. Wetlands also provide shelter for fish, insects and migratory birds. Some wetland plants help filter pollutants from runoff, although no natural area can eliminate every environmental problem. These benefits make wetlands important parts of a city's wider green network. Wetlands can also become places for learning. Where safe boardwalks and viewing areas are provided, schools can organise field trips to observe changes in water levels and wildlife. Local residents may learn to identify native plants or take part in guided birdwatching. Such activities give people a direct connection with habitats they might otherwise overlook. However, public access must be carefully managed so that visitors do not disturb sensitive nesting areas. Urban wetlands face pressure from construction, polluted water and the spread of invasive plants. Because these ecosystems are fragile, even a small change to water flow can harm the species living there. City authorities sometimes have to balance demands for new roads or housing against the need to preserve existing habitats. Restoration can help damaged sites, but it involves more than planting a few new reeds. Long-term monitoring and careful water management are equally necessary. Residents have an important role in protecting these spaces. Volunteer groups can record bird sightings, report illegal dumping and help remove litter under expert guidance. Schools can share their observations with environmental organisations, while planners can consult local communities before changing nearby land use. These efforts are most effective when scientific advice and public participation work together. Wetlands are not a complete solution to urban flooding or biodiversity loss, but maintaining them is a practical investment in healthier cities."},"answer":"A","explain":"Câu kết tổng hợp thông điệp: sáng kiến nhỏ và hợp tác cộng đồng có thể tạo thay đổi thực tế.","section":4},{"n":23,"prompt":"Which of the following is NOT mentioned as a benefit of urban wetlands?","opts":{"A":"Providing habitats for migratory birds","B":"Offering opportunities for outdoor learning","C":"Reducing the cost of heating homes","D":"Slowing rainwater flowing into city streets"},"answer":"C","explain":"Đoạn 1–2 đề cập nơi cư trú của chim, giữ nước mưa và học tập ngoài trời; không nói đến giảm chi phí sưởi.","section":5},{"n":24,"prompt":"The word “they” in paragraph 2 refers to ______.","opts":{"A":"native plants","B":"wetland habitats","C":"viewing areas","D":"people"},"answer":"D","explain":"Trong 'habitats they might otherwise overlook', 'they' thay cho 'people', những người có thể trước đây bỏ qua các sinh cảnh này.","section":5},{"n":25,"prompt":"The word “fragile” in paragraph 3 is OPPOSITE in meaning to ______.","opts":{"A":"delicate","B":"resilient","C":"easily damaged","D":"vulnerable"},"answer":"B","explain":"'Fragile' = dễ tổn thương; trái nghĩa 'resilient' = bền bỉ, có khả năng phục hồi.","section":5},{"n":26,"prompt":"The word “retain” in paragraph 1 is closest in meaning to ______.","opts":{"A":"hold","B":"pollute","C":"release","D":"measure"},"answer":"A","explain":"'Retain water' = giữ nước; 'hold' là từ gần nghĩa nhất.","section":5},{"n":27,"prompt":"Which statement is TRUE according to the passage?","opts":{"A":"Access to nesting sites should always be unrestricted","B":"Wetland restoration requires long-term care and water management","C":"Housing construction never affects urban wetlands","D":"Wetlands can remove all pollution from city runoff"},"answer":"B","explain":"Đoạn 3 nhấn mạnh phục hồi cần giám sát lâu dài và quản lý nước cẩn thận.","section":5},{"n":28,"prompt":"Which option best paraphrases the sentence “Restoration can help damaged sites, but it involves more than planting a few new reeds”?","opts":{"A":"Wetland recovery is complete as soon as new reeds are planted","B":"Damaged wetlands cannot benefit from restoration under any conditions","C":"Repairing wetlands requires broader and continuing efforts, not just adding plants","D":"Planting reeds is always more harmful than leaving a wetland untouched"},"answer":"C","explain":"Câu gốc khẳng định trồng cây thôi chưa đủ; phải có những hoạt động phục hồi khác và duy trì lâu dài.","section":5},{"n":29,"prompt":"In which paragraph does the writer discuss the tension between construction and habitat protection?","opts":{"A":"Paragraph 3","B":"Paragraph 2","C":"Paragraph 4","D":"Paragraph 1"},"answer":"A","explain":"Đoạn 3 nói chính quyền cần cân nhắc giữa mở đường, xây nhà và bảo vệ các sinh cảnh.","section":5},{"n":30,"prompt":"In which paragraph are volunteers described as recording information about wildlife?","opts":{"A":"Paragraph 3","B":"Paragraph 4","C":"Paragraph 1","D":"Paragraph 2 Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 31 to 40. BEYOND WORDS: THE VALUE OF COMMUNITY INTERPRETERS In multilingual communities, everyday services often bring together people who do not share a first language. A parent may need to discuss a child's schooling, while a patient may need to understand a treatment plan. Community interpreters help speakers exchange information accurately in these situations. Their work is not simply about replacing one word with another; it also requires attention to context, tone and the purpose of a conversation. Accuracy is particularly important when information affects someone's rights or wellbeing. An interpreter must convey precise details without adding personal opinions. In a medical appointment, for example, confusing a dosage or leaving out a question could cause serious problems. Skilled interpreters therefore ask for clarification when a statement is unclear and avoid guessing at unfamiliar technical terms. Their priority is to communicate what each speaker actually means. A further challenge is maintaining an appropriate professional role. People sometimes turn towards the interpreter rather than addressing the person they came to meet. Interpreters can support the exchange by encouraging speakers to talk directly to each other and by interpreting in the first person where appropriate. They should not take over decisions or offer advice beyond their role. An interpreter's task is to make communication possible, not to decide what others should believe. Written translations are useful, but they cannot replace every conversation. A translated notice may provide basic facts, yet it cannot answer every family's questions. If someone is confused by the notice, a trained interpreter can help the person ask for clarification. This kind of support makes services easier to navigate, especially when documents contain unfamiliar procedures. Nevertheless, organisations should also write their original information as clearly as possible. [I] Successful community interpreting depends on clear professional standards, not only fluent speech. [II] Confidentiality, impartiality and awareness of personal limits protect everyone involved. [III] Training and supervision help interpreters apply these principles when conversations become difficult. [IV] Institutions also need to allow time for clarification and ensure that speakers can ask questions. When these efforts come together, language differences need not prevent people from participating fully in community life."},"answer":"B","explain":"Đoạn 4 nêu nhóm tình nguyện 'record bird sightings' – ghi nhận các lần quan sát chim.","section":5},{"n":31,"prompt":"Where in paragraph 5 does the following sentence best fit? “These requirements are not always easy to meet in emotionally charged conversations.”","opts":{"A":"[III]","B":"[IV]","C":"[II]","D":"[I]"},"answer":"A","explain":"Câu bổ sung nói về 'these requirements' sau khi đoạn văn đã liệt kê 'Confidentiality, impartiality...' và dẫn hợp lý tới giải pháp đào tạo.","section":6},{"n":32,"prompt":"The word “precise” in paragraph 2 is OPPOSITE in meaning to ______.","opts":{"A":"specific","B":"exact","C":"accurate","D":"vague"},"answer":"D","explain":"'Precise' = chính xác, cụ thể; 'vague' = mơ hồ, trái nghĩa.","section":6},{"n":33,"prompt":"The word “convey” in paragraph 2 is closest in meaning to ______.","opts":{"A":"interrupt","B":"communicate","C":"conceal","D":"invent"},"answer":"B","explain":"'Convey' trong ngữ cảnh dịch thuật nghĩa là truyền đạt/thông báo ý nghĩa.","section":6},{"n":34,"prompt":"The word “it” in paragraph 4 refers to ______.","opts":{"A":"a medical appointment","B":"an interpreter","C":"a difficult question","D":"a translated notice"},"answer":"D","explain":"'It' trong 'yet it cannot answer every family’s questions' tham chiếu 'A translated notice'.","section":6},{"n":35,"prompt":"Which of the following is NOT TRUE according to the passage?","opts":{"A":"Interpreters sometimes ask for clarification of unclear statements","B":"Written translations may not answer all readers’ questions","C":"Interpreters should add their own advice whenever speakers disagree","D":"Professional boundaries are important during interpreted conversations"},"answer":"C","explain":"Đoạn 3 khẳng định phiên dịch viên không được tự đưa lời khuyên ngoài phạm vi chuyên môn.","section":6},{"n":36,"prompt":"Which of the following best summarises paragraph 3?","opts":{"A":"People must address interpreters instead of talking to one another","B":"Interpreters should enable direct communication while respecting professional boundaries","C":"Interpreters should make important decisions for both speakers","D":"Interpreters work effectively only when they provide personal advice"},"answer":"B","explain":"Đoạn 3 tập trung vào vai trò trung gian trung lập, giúp người nói giao tiếp trực tiếp và không quyết định thay.","section":6},{"n":37,"prompt":"Which of the following is TRUE according to the passage?","opts":{"A":"Technical vocabulary can always be guessed safely","B":"Interpreters are expected to change speakers’ opinions to prevent conflict","C":"Institutions should allow enough time for interpreted conversations and questions","D":"Written notices make interpreters unnecessary in every situation"},"answer":"C","explain":"Đoạn 5 khuyến nghị tổ chức dành thời gian để làm rõ ý và cho người tham gia đặt câu hỏi.","section":6},{"n":38,"prompt":"Which option best paraphrases the sentence “An interpreter’s task is to make communication possible, not to decide what others should believe”?","opts":{"A":"Interpreters are responsible for changing people’s personal beliefs","B":"Interpreters should refuse to translate whenever views are different","C":"Interpreters should choose the most convincing argument for participants","D":"Interpreters facilitate understanding without imposing their own judgements"},"answer":"D","explain":"Câu gốc phân biệt nhiệm vụ truyền đạt với việc áp đặt đánh giá hoặc quan điểm riêng.","section":6},{"n":39,"prompt":"What can be inferred from the passage?","opts":{"A":"Community services never need to clarify written information","B":"Only language fluency matters in successful interpreting","C":"Good language access requires institutional support as well as skilled interpreters","D":"Cultural differences disappear once a notice is translated"},"answer":"C","explain":"Từ các đoạn 4–5 suy ra sự giao tiếp hiệu quả còn cần tổ chức viết rõ ràng và hỗ trợ thời gian, quy trình.","section":6},{"n":40,"prompt":"Which title best summarises the passage?","opts":{"A":"Beyond Translation: Why Community Interpreters Matter","B":"Why Multilingual Communities Should Avoid Public Services","C":"Why Written Notices Are Better Than Every Conversation","D":"A Short History of Computer-Assisted Translation ANSWER KEY & DETAILED EXPLANATIONS TASK 1 – ADVERTISEMENT TASK 2 – LEAFLET TASK 3 – ARRANGEMENT TASK 4 – EXTENDED CLOZE TASK 5 – READING COMPREHENSION TASK 6 – ADVANCED READING"},"answer":"A","explain":"Bài phân tích tầm quan trọng của phiên dịch viên cộng đồng vượt ngoài việc dịch từ, gồm độ chính xác, đạo đức và hỗ trợ.","section":6}],"sections":[{"id":1,"title":"TASK 1 – ADVERTISEMENT","range":[1,6],"passage":"ADVERTISEMENT – GREEN COMMUTE WEEK: SMALL TRIPS, BIG CHANGE","text":"Would you like to help your neighbourhood breathe easier? The City Youth Council has launched Green Commute Week, a campaign (1) ______ encourages students to rethink the way they travel. By (2) ______ public transport or walking short distances, participants can reduce unnecessary car journeys. Even one changed journey can have a (3) ______ impact when hundreds of students join in. We will provide (4) ______ to help everyone travel safely and confidently. Each class is invited to (5) ______ a pledge to replace at least two car journeys this week. Share your experiences online and turn everyday travel (6) ______ a chance to protect the environment. Register with your form teacher by Monday!","translation":"QUẢNG CÁO – TUẦN LỄ DI CHUYỂN XANH: NHỮNG CHUYẾN ĐI NHỎ, THAY ĐỔI LỚN\nBạn có muốn giúp khu phố của mình có không khí trong lành hơn không? Hội đồng Thanh niên Thành phố đã phát động Tuần lễ Di chuyển Xanh, một chiến dịch khuyến khích học sinh suy nghĩ lại về cách đi lại. Bằng cách sử dụng phương tiện giao thông công cộng hoặc đi bộ những quãng đường ngắn, người tham gia có thể giảm những chuyến đi ô tô không cần thiết. Chỉ một chuyến đi được thay đổi cũng có thể tạo ra tác động tích cực khi hàng trăm học sinh cùng tham gia. Chúng tôi sẽ cung cấp các bản đồ khu phố được minh họa rõ ràng để giúp mọi người đi lại an toàn và tự tin. Mỗi lớp được mời đưa ra cam kết thay thế ít nhất hai chuyến đi bằng ô tô trong tuần này. Hãy chia sẻ trải nghiệm trực tuyến và biến việc đi lại hằng ngày thành cơ hội bảo vệ môi trường. Hãy đăng ký với giáo viên chủ nhiệm trước thứ Hai!"},{"id":2,"title":"TASK 2 – LEAFLET","range":[7,12],"passage":"LEAFLET – TASTE THE STORIES BEHIND OUR FOOD!","text":"Our Community Food Festival is returning this Saturday! (7) ______ families have already registered to share traditional recipes, and the number is growing. Volunteers will (8) ______ tasting stations in the school courtyard, where visitors can discover how food connects generations. (9) ______ you have never cooked before, you are welcome to join our beginner-friendly activities. Skilled cooks will give (10) ______ demonstrations so that everyone can follow each step. Participants will also explore the (11) ______ meanings of dishes served during important celebrations. Please listen to other people's stories (12) ______ an open mind; every recipe has a history worth hearing. Admission is free, but please bring a reusable container.","translation":"TỜ RƠI – HÃY NẾM THỬ NHỮNG CÂU CHUYỆN ĐẰNG SAU MÓN ĂN!\nLễ hội Ẩm thực Cộng đồng của chúng ta sẽ trở lại vào thứ Bảy này! Một số lượng lớn các gia đình đã đăng ký chia sẻ những công thức truyền thống và con số này vẫn đang tăng lên. Các tình nguyện viên sẽ bố trí những quầy thử món ăn trong sân trường, nơi khách tham quan có thể khám phá cách thức ăn kết nối các thế hệ. Ngay cả khi bạn chưa từng nấu ăn, bạn vẫn được chào đón tham gia các hoạt động thân thiện với người mới bắt đầu. Những đầu bếp lành nghề sẽ trình diễn một cách tương tác để mọi người có thể làm theo từng bước. Người tham gia cũng sẽ khám phá ý nghĩa văn hóa của các món ăn được phục vụ trong những dịp lễ quan trọng. Hãy lắng nghe câu chuyện của người khác với một tâm trí cởi mở; mỗi công thức đều có một lịch sử đáng để lắng nghe. Vào cửa miễn phí, nhưng vui lòng mang theo hộp đựng có thể tái sử dụng."},{"id":3,"title":"TASK 3 – ARRANGEMENT","range":[13,17],"passage":null,"text":null,"translation":""},{"id":4,"title":"TASK 4 – EXTENDED CLOZE","range":[18,22],"passage":"A COMMUNITY LIBRARY ON WHEELS","text":"The idea for a travelling library (18) ______. In 2021, high school student Thao noticed that children in an outlying district had to travel far to borrow books. Rather than waiting for a new building, she began collecting donated books and asked neighbours (19) ______. With the help of a local mechanic, (20) ______. The team then visited small villages every weekend, inviting children to choose books and join storytelling sessions. (21) ______. Encouraged by this response, volunteers added basic science activities and reading games. The project reminds us that meaningful progress does not always require expensive equipment. (22) ______.","translation":"THƯ VIỆN LƯU ĐỘNG\nÝ tưởng về một thư viện lưu động bắt đầu từ quyết tâm của một học sinh muốn mở rộng cơ hội tiếp cận sách. Năm 2021, Thảo, một học sinh trung học, nhận thấy trẻ em ở một huyện vùng xa phải đi rất xa để mượn sách. Thay vì chờ đợi một tòa nhà mới, bạn bắt đầu thu gom sách quyên góp và nhờ hàng xóm giúp phân loại sách cũng như tổ chức các chuyến đi cuối tuần. Với sự giúp đỡ của một thợ sửa xe địa phương, các học sinh đã biến một chiếc xe đạp chở hàng không còn sử dụng thành một kệ sách lưu động. Sau đó, nhóm đến các ngôi làng nhỏ vào mỗi cuối tuần, mời trẻ em chọn sách và tham gia các buổi kể chuyện. Chẳng bao lâu, các gia đình bắt đầu chờ thư viện đến vào mỗi thứ Bảy. Được khích lệ bởi sự hưởng ứng này, các tình nguyện viên bổ sung những hoạt động khoa học cơ bản và trò chơi đọc sách. Dự án nhắc nhở chúng ta rằng tiến bộ có ý nghĩa không phải lúc nào cũng cần thiết bị đắt tiền. Một ý tưởng nhỏ, được cộng đồng hỗ trợ, có thể mở ra những cơ hội mới cho trẻ em."},{"id":5,"title":"TASK 5 – READING COMPREHENSION","range":[23,30],"passage":"THE QUIET POWER OF URBAN WETLANDS","text":"In many growing cities, wetlands are dismissed as muddy, unused land. Yet these areas perform valuable services that are difficult to replace. During heavy rain, their soil and plants can retain water, slowing the flow into nearby streets. Wetlands also provide shelter for fish, insects and migratory birds. Some wetland plants help filter pollutants from runoff, although no natural area can eliminate every environmental problem. These benefits make wetlands important parts of a city's wider green network.\n\nWetlands can also become places for learning. Where safe boardwalks and viewing areas are provided, schools can organise field trips to observe changes in water levels and wildlife. Local residents may learn to identify native plants or take part in guided birdwatching. Such activities give people a direct connection with habitats they might otherwise overlook. However, public access must be carefully managed so that visitors do not disturb sensitive nesting areas.\n\nUrban wetlands face pressure from construction, polluted water and the spread of invasive plants. Because these ecosystems are fragile, even a small change to water flow can harm the species living there. City authorities sometimes have to balance demands for new roads or housing against the need to preserve existing habitats. Restoration can help damaged sites, but it involves more than planting a few new reeds. Long-term monitoring and careful water management are equally necessary.\n\nResidents have an important role in protecting these spaces. Volunteer groups can record bird sightings, report illegal dumping and help remove litter under expert guidance. Schools can share their observations with environmental organisations, while planners can consult local communities before changing nearby land use. These efforts are most effective when scientific advice and public participation work together. Wetlands are not a complete solution to urban flooding or biodiversity loss, but maintaining them is a practical investment in healthier cities.","translation":"SỨC MẠNH THẦM LẶNG CỦA CÁC VÙNG ĐẤT NGẬP NƯỚC ĐÔ THỊ\nỞ nhiều thành phố đang phát triển, vùng đất ngập nước bị xem là vùng đất lầy lội, không được sử dụng. Tuy nhiên, những khu vực này cung cấp các dịch vụ có giá trị và khó có thể thay thế. Khi mưa lớn, đất và thực vật ở đó có thể giữ nước, làm chậm dòng nước chảy vào các con phố lân cận. Vùng đất ngập nước cũng là nơi trú ẩn cho cá, côn trùng và chim di cư. Một số loài thực vật ở vùng đất ngập nước giúp lọc chất ô nhiễm từ dòng nước chảy tràn, mặc dù không có khu vực tự nhiên nào có thể loại bỏ mọi vấn đề môi trường. Những lợi ích này khiến vùng đất ngập nước trở thành bộ phận quan trọng trong mạng lưới không gian xanh rộng lớn hơn của thành phố.\nVùng đất ngập nước cũng có thể trở thành nơi học tập. Khi có lối đi bộ trên cao và khu vực quan sát an toàn, trường học có thể tổ chức các chuyến đi thực tế để quan sát sự thay đổi mực nước và động vật hoang dã. Người dân địa phương có thể học cách nhận biết cây bản địa hoặc tham gia hoạt động ngắm chim có hướng dẫn. Những hoạt động này giúp mọi người kết nối trực tiếp với các môi trường sống mà nếu không họ có thể bỏ qua. Tuy nhiên, việc tiếp cận công cộng phải được quản lý cẩn thận để khách tham quan không làm xáo trộn các khu vực làm tổ nhạy cảm.\nCác vùng đất ngập nước đô thị chịu áp lực từ hoạt động xây dựng, nguồn nước ô nhiễm và sự lan rộng của các loài thực vật xâm lấn. Vì những hệ sinh thái này rất mong manh, ngay cả một thay đổi nhỏ về dòng chảy của nước cũng có thể gây hại cho các loài sinh sống ở đó. Chính quyền thành phố đôi khi phải cân bằng nhu cầu xây dựng đường sá hoặc nhà ở mới với việc bảo tồn các môi trường sống hiện có. Việc phục hồi có thể giúp những địa điểm bị hư hại, nhưng công việc này không chỉ đơn giản là trồng thêm vài cây sậy. Việc giám sát lâu dài và quản lý nước cẩn thận cũng cần thiết như vậy.\nNgười dân có vai trò quan trọng trong việc bảo vệ những không gian này. Các nhóm tình nguyện có thể ghi nhận những lần nhìn thấy chim, báo cáo việc đổ rác trái phép và giúp dọn rác dưới sự hướng dẫn của chuyên gia. Trường học có thể chia sẻ quan sát của mình với các tổ chức môi trường, trong khi các nhà quy hoạch có thể tham khảo ý kiến cộng đồng địa phương trước khi thay đổi việc sử dụng đất gần đó. Những nỗ lực này hiệu quả nhất khi tư vấn khoa học và sự tham gia của công chúng phối hợp với nhau. Vùng đất ngập nước không phải là giải pháp hoàn chỉnh cho tình trạng ngập lụt đô thị hay suy giảm đa dạng sinh học, nhưng việc duy trì chúng là một khoản đầu tư thiết thực cho các thành phố khỏe mạnh hơn."},{"id":6,"title":"TASK 6 – ADVANCED READING","range":[31,40],"passage":"BEYOND WORDS: THE VALUE OF COMMUNITY INTERPRETERS","text":"In multilingual communities, everyday services often bring together people who do not share a first language. A parent may need to discuss a child's schooling, while a patient may need to understand a treatment plan. Community interpreters help speakers exchange information accurately in these situations. Their work is not simply about replacing one word with another; it also requires attention to context, tone and the purpose of a conversation.\n\nAccuracy is particularly important when information affects someone's rights or wellbeing. An interpreter must convey precise details without adding personal opinions. In a medical appointment, for example, confusing a dosage or leaving out a question could cause serious problems. Skilled interpreters therefore ask for clarification when a statement is unclear and avoid guessing at unfamiliar technical terms. Their priority is to communicate what each speaker actually means.\n\nA further challenge is maintaining an appropriate professional role. People sometimes turn towards the interpreter rather than addressing the person they came to meet. Interpreters can support the exchange by encouraging speakers to talk directly to each other and by interpreting in the first person where appropriate. They should not take over decisions or offer advice beyond their role. An interpreter's task is to make communication possible, not to decide what others should believe.\n\nWritten translations are useful, but they cannot replace every conversation. A translated notice may provide basic facts, yet it cannot answer every family's questions. If someone is confused by the notice, a trained interpreter can help the person ask for clarification. This kind of support makes services easier to navigate, especially when documents contain unfamiliar procedures. Nevertheless, organisations should also write their original information as clearly as possible.\n\n[I] Successful community interpreting depends on clear professional standards, not only fluent speech. [II] Confidentiality, impartiality and awareness of personal limits protect everyone involved. [III] Training and supervision help interpreters apply these principles when conversations become difficult. [IV] Institutions also need to allow time for clarification and ensure that speakers can ask questions. When these efforts come together, language differences need not prevent people from participating fully in community life.","translation":"VƯỢT RA NGOÀI NGÔN TỪ: GIÁ TRỊ CỦA PHIÊN DỊCH VIÊN CỘNG ĐỒNG\nTrong các cộng đồng đa ngôn ngữ, những dịch vụ hằng ngày thường kết nối những người không có cùng tiếng mẹ đẻ. Một phụ huynh có thể cần trao đổi về việc học của con, trong khi một bệnh nhân có thể cần hiểu kế hoạch điều trị. Phiên dịch viên cộng đồng giúp mọi người trao đổi thông tin chính xác trong những tình huống này. Công việc của họ không chỉ đơn giản là thay một từ bằng một từ khác; nó còn đòi hỏi sự chú ý đến ngữ cảnh, giọng điệu và mục đích của cuộc trò chuyện.\nĐộ chính xác đặc biệt quan trọng khi thông tin ảnh hưởng đến quyền lợi hoặc sức khỏe của ai đó. Phiên dịch viên phải truyền đạt các chi tiết chính xác mà không thêm ý kiến cá nhân. Ví dụ, trong một cuộc hẹn khám bệnh, việc nhầm liều thuốc hoặc bỏ sót một câu hỏi có thể gây ra vấn đề nghiêm trọng. Vì vậy, phiên dịch viên có kỹ năng sẽ yêu cầu làm rõ khi phát biểu chưa rõ ràng và tránh đoán nghĩa những thuật ngữ chuyên môn không quen thuộc. Ưu tiên của họ là truyền đạt đúng điều mỗi người nói thực sự muốn diễn đạt.\nMột thách thức khác là duy trì vai trò chuyên môn phù hợp. Đôi khi mọi người quay sang nói với phiên dịch viên thay vì trực tiếp nói với người mà họ đến gặp. Phiên dịch viên có thể hỗ trợ cuộc trao đổi bằng cách khuyến khích mọi người nói trực tiếp với nhau và sử dụng ngôi thứ nhất khi thích hợp. Họ không nên quyết định thay hoặc đưa ra lời khuyên vượt quá vai trò của mình. Nhiệm vụ của phiên dịch viên là giúp việc giao tiếp trở nên khả thi, chứ không phải quyết định người khác nên tin vào điều gì.\nBản dịch viết rất hữu ích, nhưng chúng không thể thay thế mọi cuộc trò chuyện. Một thông báo đã dịch có thể cung cấp thông tin cơ bản, nhưng không thể trả lời mọi câu hỏi của các gia đình. Nếu ai đó chưa hiểu thông báo, một phiên dịch viên được đào tạo có thể giúp người đó yêu cầu giải thích rõ hơn. Sự hỗ trợ này giúp mọi người sử dụng dịch vụ dễ dàng hơn, đặc biệt khi tài liệu có những quy trình không quen thuộc. Tuy nhiên, các tổ chức cũng nên viết thông tin gốc một cách rõ ràng nhất có thể.\n[I] Hoạt động phiên dịch cộng đồng thành công phụ thuộc vào các tiêu chuẩn chuyên môn rõ ràng, chứ không chỉ vào khả năng nói trôi chảy. [II] Tính bảo mật, sự công tâm và nhận thức về giới hạn cá nhân bảo vệ tất cả những người liên quan. [III] Việc đào tạo và giám sát giúp phiên dịch viên áp dụng những nguyên tắc này khi cuộc trò chuyện trở nên khó khăn. [IV] Các tổ chức cũng cần dành thời gian để làm rõ thông tin và đảm bảo người nói có thể đặt câu hỏi. Khi những nỗ lực này kết hợp với nhau, khác biệt ngôn ngữ không nhất thiết ngăn cản mọi người tham gia đầy đủ vào đời sống cộng đồng."}],"translations":{"ADVERTISEMENT – GREEN COMMUTE WEEK: SMALL TRIPS, BIG CHANGE":"QUẢNG CÁO – TUẦN LỄ DI CHUYỂN XANH: NHỮNG CHUYẾN ĐI NHỎ, THAY ĐỔI LỚN\nBạn có muốn giúp khu phố của mình có không khí trong lành hơn không? Hội đồng Thanh niên Thành phố đã phát động Tuần lễ Di chuyển Xanh, một chiến dịch khuyến khích học sinh suy nghĩ lại về cách đi lại. Bằng cách sử dụng phương tiện giao thông công cộng hoặc đi bộ những quãng đường ngắn, người tham gia có thể giảm những chuyến đi ô tô không cần thiết. Chỉ một chuyến đi được thay đổi cũng có thể tạo ra tác động tích cực khi hàng trăm học sinh cùng tham gia. Chúng tôi sẽ cung cấp các bản đồ khu phố được minh họa rõ ràng để giúp mọi người đi lại an toàn và tự tin. Mỗi lớp được mời đưa ra cam kết thay thế ít nhất hai chuyến đi bằng ô tô trong tuần này. Hãy chia sẻ trải nghiệm trực tuyến và biến việc đi lại hằng ngày thành cơ hội bảo vệ môi trường. Hãy đăng ký với giáo viên chủ nhiệm trước thứ Hai!","LEAFLET – TASTE THE STORIES BEHIND OUR FOOD!":"TỜ RƠI – HÃY NẾM THỬ NHỮNG CÂU CHUYỆN ĐẰNG SAU MÓN ĂN!\nLễ hội Ẩm thực Cộng đồng của chúng ta sẽ trở lại vào thứ Bảy này! Một số lượng lớn các gia đình đã đăng ký chia sẻ những công thức truyền thống và con số này vẫn đang tăng lên. Các tình nguyện viên sẽ bố trí những quầy thử món ăn trong sân trường, nơi khách tham quan có thể khám phá cách thức ăn kết nối các thế hệ. Ngay cả khi bạn chưa từng nấu ăn, bạn vẫn được chào đón tham gia các hoạt động thân thiện với người mới bắt đầu. Những đầu bếp lành nghề sẽ trình diễn một cách tương tác để mọi người có thể làm theo từng bước. Người tham gia cũng sẽ khám phá ý nghĩa văn hóa của các món ăn được phục vụ trong những dịp lễ quan trọng. Hãy lắng nghe câu chuyện của người khác với một tâm trí cởi mở; mỗi công thức đều có một lịch sử đáng để lắng nghe. Vào cửa miễn phí, nhưng vui lòng mang theo hộp đựng có thể tái sử dụng.","A COMMUNITY LIBRARY ON WHEELS":"THƯ VIỆN LƯU ĐỘNG\nÝ tưởng về một thư viện lưu động bắt đầu từ quyết tâm của một học sinh muốn mở rộng cơ hội tiếp cận sách. Năm 2021, Thảo, một học sinh trung học, nhận thấy trẻ em ở một huyện vùng xa phải đi rất xa để mượn sách. Thay vì chờ đợi một tòa nhà mới, bạn bắt đầu thu gom sách quyên góp và nhờ hàng xóm giúp phân loại sách cũng như tổ chức các chuyến đi cuối tuần. Với sự giúp đỡ của một thợ sửa xe địa phương, các học sinh đã biến một chiếc xe đạp chở hàng không còn sử dụng thành một kệ sách lưu động. Sau đó, nhóm đến các ngôi làng nhỏ vào mỗi cuối tuần, mời trẻ em chọn sách và tham gia các buổi kể chuyện. Chẳng bao lâu, các gia đình bắt đầu chờ thư viện đến vào mỗi thứ Bảy. Được khích lệ bởi sự hưởng ứng này, các tình nguyện viên bổ sung những hoạt động khoa học cơ bản và trò chơi đọc sách. Dự án nhắc nhở chúng ta rằng tiến bộ có ý nghĩa không phải lúc nào cũng cần thiết bị đắt tiền. Một ý tưởng nhỏ, được cộng đồng hỗ trợ, có thể mở ra những cơ hội mới cho trẻ em.","THE QUIET POWER OF URBAN WETLANDS":"SỨC MẠNH THẦM LẶNG CỦA CÁC VÙNG ĐẤT NGẬP NƯỚC ĐÔ THỊ\nỞ nhiều thành phố đang phát triển, vùng đất ngập nước bị xem là vùng đất lầy lội, không được sử dụng. Tuy nhiên, những khu vực này cung cấp các dịch vụ có giá trị và khó có thể thay thế. Khi mưa lớn, đất và thực vật ở đó có thể giữ nước, làm chậm dòng nước chảy vào các con phố lân cận. Vùng đất ngập nước cũng là nơi trú ẩn cho cá, côn trùng và chim di cư. Một số loài thực vật ở vùng đất ngập nước giúp lọc chất ô nhiễm từ dòng nước chảy tràn, mặc dù không có khu vực tự nhiên nào có thể loại bỏ mọi vấn đề môi trường. Những lợi ích này khiến vùng đất ngập nước trở thành bộ phận quan trọng trong mạng lưới không gian xanh rộng lớn hơn của thành phố.\nVùng đất ngập nước cũng có thể trở thành nơi học tập. Khi có lối đi bộ trên cao và khu vực quan sát an toàn, trường học có thể tổ chức các chuyến đi thực tế để quan sát sự thay đổi mực nước và động vật hoang dã. Người dân địa phương có thể học cách nhận biết cây bản địa hoặc tham gia hoạt động ngắm chim có hướng dẫn. Những hoạt động này giúp mọi người kết nối trực tiếp với các môi trường sống mà nếu không họ có thể bỏ qua. Tuy nhiên, việc tiếp cận công cộng phải được quản lý cẩn thận để khách tham quan không làm xáo trộn các khu vực làm tổ nhạy cảm.\nCác vùng đất ngập nước đô thị chịu áp lực từ hoạt động xây dựng, nguồn nước ô nhiễm và sự lan rộng của các loài thực vật xâm lấn. Vì những hệ sinh thái này rất mong manh, ngay cả một thay đổi nhỏ về dòng chảy của nước cũng có thể gây hại cho các loài sinh sống ở đó. Chính quyền thành phố đôi khi phải cân bằng nhu cầu xây dựng đường sá hoặc nhà ở mới với việc bảo tồn các môi trường sống hiện có. Việc phục hồi có thể giúp những địa điểm bị hư hại, nhưng công việc này không chỉ đơn giản là trồng thêm vài cây sậy. Việc giám sát lâu dài và quản lý nước cẩn thận cũng cần thiết như vậy.\nNgười dân có vai trò quan trọng trong việc bảo vệ những không gian này. Các nhóm tình nguyện có thể ghi nhận những lần nhìn thấy chim, báo cáo việc đổ rác trái phép và giúp dọn rác dưới sự hướng dẫn của chuyên gia. Trường học có thể chia sẻ quan sát của mình với các tổ chức môi trường, trong khi các nhà quy hoạch có thể tham khảo ý kiến cộng đồng địa phương trước khi thay đổi việc sử dụng đất gần đó. Những nỗ lực này hiệu quả nhất khi tư vấn khoa học và sự tham gia của công chúng phối hợp với nhau. Vùng đất ngập nước không phải là giải pháp hoàn chỉnh cho tình trạng ngập lụt đô thị hay suy giảm đa dạng sinh học, nhưng việc duy trì chúng là một khoản đầu tư thiết thực cho các thành phố khỏe mạnh hơn.","BEYOND WORDS: THE VALUE OF COMMUNITY INTERPRETERS":"VƯỢT RA NGOÀI NGÔN TỪ: GIÁ TRỊ CỦA PHIÊN DỊCH VIÊN CỘNG ĐỒNG\nTrong các cộng đồng đa ngôn ngữ, những dịch vụ hằng ngày thường kết nối những người không có cùng tiếng mẹ đẻ. Một phụ huynh có thể cần trao đổi về việc học của con, trong khi một bệnh nhân có thể cần hiểu kế hoạch điều trị. Phiên dịch viên cộng đồng giúp mọi người trao đổi thông tin chính xác trong những tình huống này. Công việc của họ không chỉ đơn giản là thay một từ bằng một từ khác; nó còn đòi hỏi sự chú ý đến ngữ cảnh, giọng điệu và mục đích của cuộc trò chuyện.\nĐộ chính xác đặc biệt quan trọng khi thông tin ảnh hưởng đến quyền lợi hoặc sức khỏe của ai đó. Phiên dịch viên phải truyền đạt các chi tiết chính xác mà không thêm ý kiến cá nhân. Ví dụ, trong một cuộc hẹn khám bệnh, việc nhầm liều thuốc hoặc bỏ sót một câu hỏi có thể gây ra vấn đề nghiêm trọng. Vì vậy, phiên dịch viên có kỹ năng sẽ yêu cầu làm rõ khi phát biểu chưa rõ ràng và tránh đoán nghĩa những thuật ngữ chuyên môn không quen thuộc. Ưu tiên của họ là truyền đạt đúng điều mỗi người nói thực sự muốn diễn đạt.\nMột thách thức khác là duy trì vai trò chuyên môn phù hợp. Đôi khi mọi người quay sang nói với phiên dịch viên thay vì trực tiếp nói với người mà họ đến gặp. Phiên dịch viên có thể hỗ trợ cuộc trao đổi bằng cách khuyến khích mọi người nói trực tiếp với nhau và sử dụng ngôi thứ nhất khi thích hợp. Họ không nên quyết định thay hoặc đưa ra lời khuyên vượt quá vai trò của mình. Nhiệm vụ của phiên dịch viên là giúp việc giao tiếp trở nên khả thi, chứ không phải quyết định người khác nên tin vào điều gì.\nBản dịch viết rất hữu ích, nhưng chúng không thể thay thế mọi cuộc trò chuyện. Một thông báo đã dịch có thể cung cấp thông tin cơ bản, nhưng không thể trả lời mọi câu hỏi của các gia đình. Nếu ai đó chưa hiểu thông báo, một phiên dịch viên được đào tạo có thể giúp người đó yêu cầu giải thích rõ hơn. Sự hỗ trợ này giúp mọi người sử dụng dịch vụ dễ dàng hơn, đặc biệt khi tài liệu có những quy trình không quen thuộc. Tuy nhiên, các tổ chức cũng nên viết thông tin gốc một cách rõ ràng nhất có thể.\n[I] Hoạt động phiên dịch cộng đồng thành công phụ thuộc vào các tiêu chuẩn chuyên môn rõ ràng, chứ không chỉ vào khả năng nói trôi chảy. [II] Tính bảo mật, sự công tâm và nhận thức về giới hạn cá nhân bảo vệ tất cả những người liên quan. [III] Việc đào tạo và giám sát giúp phiên dịch viên áp dụng những nguyên tắc này khi cuộc trò chuyện trở nên khó khăn. [IV] Các tổ chức cũng cần dành thời gian để làm rõ thông tin và đảm bảo người nói có thể đặt câu hỏi. Khi những nỗ lực này kết hợp với nhau, khác biệt ngôn ngữ không nhất thiết ngăn cản mọi người tham gia đầy đủ vào đời sống cộng đồng."}};
let sectionId=1, index=0, chosen={};
const $=id=>document.getElementById(id);
function unlock(){if($('pw').value==='367'){$('login').classList.add('hidden');$('app').classList.remove('hidden');buildNav();render()}else $('loginMsg').textContent='Incorrect password. Please try again.'}
function currentSection(){return DATA.sections.find(s=>s.id===sectionId)}
function qs(){return DATA.questions.filter(q=>q.section===sectionId)}
function buildNav(){$('sectionNav').innerHTML=DATA.sections.map(s=>`<button class="${s.id===sectionId?'active':''}" onclick="switchSection(${s.id})">${s.title}</button>`).join('')}
function switchSection(id){sectionId=id;index=0;buildNav();render()}
function render(){let s=currentSection(),list=qs(),q=list[index];$('sectionTag').textContent=`SECTION ${sectionId} / 6`;$('sectionTitle').textContent=s.title;$('qnum').textContent=`QUESTION ${q.n}`;$('progress').textContent=`${index+1} / ${list.length}`;$('prompt').textContent=q.prompt;
let passage=s.text;$('reading').classList.toggle('hidden',!passage);
if(passage){$('passageTitle').textContent=s.passage;$('passageText').textContent=passage;$('translationText').textContent=s.translation||'Bản dịch chưa có trong dữ liệu.';$('translationBox').classList.remove('show');$('translateBtn').textContent='🇻🇳 Show Vietnamese translation'}
if(sectionId===3){
 const lines=(q.arrangementLines||[]).map(x=>`<div class="arrange-line"><b>${x.letter}.</b> ${esc(x.text)}</div>`).join('');
 const opts=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="arrange-choice ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
 $('options').innerHTML=`<div class="arrange-grid"><section class="arrange-panel"><h4>Utterances / Sentences</h4>${lines}</section><section class="arrange-panel"><h4>Choose the correct order</h4>${opts}</section></div>`;
}else{
 $('options').innerHTML=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="option ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
}
let fb='';if(chosen[q.n]){let ok=chosen[q.n]===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct!':'Not quite.'}</b><br>Correct answer: <b>${q.answer}</b><br><b>Giải thích:</b> ${esc(q.explain)}<br><span class="small">Bạn đã chọn ${chosen[q.n]}.</span></div>`}$('feedback').innerHTML=fb;
$('prev').disabled=index===0;$('next').disabled=index===list.length-1;$('next').textContent=index===list.length-1?'End of section':'Next →';updateScore()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTranslation(){let box=$('translationBox');box.classList.toggle('show');$('translateBtn').textContent=box.classList.contains('show')?'Hide Vietnamese translation':'🇻🇳 Show Vietnamese translation'}
function answer(k){let q=qs()[index];if(chosen[q.n])return;chosen[q.n]=k;render()}
function move(d){index=Math.max(0,Math.min(qs().length-1,index+d));render()}
function updateScore(){let list=qs(),done=list.filter(q=>chosen[q.n]).length,correct=list.filter(q=>chosen[q.n]===q.answer).length;let t=`Score: ${correct} / ${list.length} · Answered: ${done} / ${list.length}`;$('score').textContent=t;$('bottomScore').textContent=t}
function resetSection(){if(!confirm('Reset all answers in this section?'))return;qs().forEach(q=>delete chosen[q.n]);index=0;render()}
</script></body></html>
